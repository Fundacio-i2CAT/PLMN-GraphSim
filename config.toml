# Simulation Configuration

[simulation]
# Scale Factor: 1 Agent represents X real users.
# Higher values = fewer agents = faster simulation but less granular.
# Lower values = more agents = slower simulation but more realistic distribution.
# This is tipically a good compromise between speed and realism, even with big countries such as the US
# but feel free to play with the resolution.
scale_factor = 1000

# Duration of the simulation in time units
duration = 100.0

# Mean duration of a user session (active time)
mean_session_duration = 95.0

# Mean time between sessions (offline time)
mean_offline_duration = 5.0

# Sampling Interval for Metrics (in time units)
# Increase this value to speed up simulation (e.g., 5.0 or 10.0)
sampling_interval = 1.0

# Log Level: "debug", "info", "warn", "error"
log_level = "info"

# Number of PDU Sessions per User (e.g., Internet + IMS/VoNR)
# This changes depending on the use case. Since we only are measuring eMBB for now, we only have two.
min_sessions_per_user = 1
max_sessions_per_user = 2

# Architecture Configuration
scenario_mode = "single_tier" # Options: "single_tier", "two_tier"
num_centralized_upfs = 5 # Only used if scenario_mode = "two_tier"

# --- Mobility (PoC) ---
# Disabled by default: leaves the legacy stationary "always-on" eMBB behaviour
# untouched. Enable to study handover signaling cost (5G inter-UPF migration vs
# 6G-RUPA local renumbering). See docs/scenarios/mobility/.
[simulation.mobility]
enabled = false
model = "random_waypoint"   # Options: "none", "random_waypoint"
update_interval = 1.0       # Simulation seconds between position updates / HO checks
speed_kmh = 5.0             # Pedestrian ~5, vehicular ~50, HSR ~250
pause_time = 0.0            # Reserved for future stateful waypoint model
max_jump_km = 1.0           # Cap per-tick displacement (sanity bound)

[countries]

[countries.spain]
enabled = true
data_dir = "data/spain"
mccs = [214]
population = 49_442_844
mobile_adoption_rate = 0.82

[countries.spain.scenarios]
# Define the scenarios to run.
# Key is the Scenario Name, Value is the Number of UPFs (Centroids).
# You can add as many scenarios as you want and the simulator will automatically pick them up.
# "Quick Testing ESP" = 1
# "Spain Legacy" = 3
"Spain Distributed" = 52 # 52 is the number of provinces in Spain without Canary Islands, but counting ceuta and melilla.

[countries.spain.operators]
vodafone = { id = 1, enabled = true }
orange = { id = 3, enabled = true }
movistar = { id = 7, enabled = true }

[countries.portugal]
# Iberia roaming scenario (phase 2). Official sources mirroring Spain's INE+IGN pair:
# INE Portugal Censos 2021 population (indicator 0011609) + DGT CAOP2025 polygons
# (mainland/Continente only — Madeira/Azores excluded like the Canary Islands).
# gNBs: OpenCellID MCC 268 (22,627 cells).
enabled = true
data_dir = "data/portugal"
mccs = [268]
population = 9_855_909
mobile_adoption_rate = 0.82
num_psas = 2 # MEO/Altice dual core (Lisboa + Porto); ~1 PSA per 10M pop, cf. Spain/USA 5

[countries.portugal.scenarios]
"Portugal Distributed" = 18 # 18 mainland distritos

[countries.portugal.operators]
# net ids verified against the OpenCellID 268 data (cell counts):
vodafone_pt = { id = 1, enabled = true } # 7,695 cells
meo = { id = 6, enabled = true }         # 6,791 cells (+4,091 under net 2, also MEO/ex-TMN allocation)
nos = { id = 3, enabled = true }         # 4,050 cells

[countries.usa]
