<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="ui-sans-serif, system-ui, sans-serif">
  <style>
    .band   { fill: #f2f1ee; stroke: #e3e2dd; }
    .bandlbl{ fill: #8a8983; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .mbox   { fill: #ffffff; stroke: #d7d6d1; rx: 7; }
    .mname  { fill: #0b0b0b; font-size: 11px; font-weight: 600; }
    .fedbox { fill: #ffffff; stroke: #b9b8b2; rx: 8; }
    .fedname{ fill: #0b0b0b; font-size: 11.5px; font-weight: 600; }
    .dagedge{ stroke: #c9c8c2; stroke-width: 1.4; }
    .edge   { stroke: #d7d6d1; stroke-width: 1; }
    .cap    { fill: #52514e; font-size: 11px; }
    .capmut { fill: #8a8983; font-size: 10.5px; }
    .climb  { stroke: #2a78d6; stroke-width: 2.4; fill: none; }
    .climblbl { fill: #2a78d6; font-size: 11px; font-weight: 600; }
    .es { fill: #2a78d6; } .pt { fill: #eb6834; } .fed { fill: #52514e; }
    .title { fill: #0b0b0b; font-size: 16px; font-weight: 700; }
    .sub   { fill: #52514e; font-size: 11.5px; }
    .recbox{ fill: #fbfbf9; stroke: #2a78d6; stroke-width: 1.3; rx: 8; }
    .reclbl{ fill: #0b0b0b; font-size: 10.5px; }
  </style>

  <text class="title" x="28" y="34">Graph of graphs: one recursive climb classifies every handover</text>
  <text class="sub"   x="28" y="54">pan-Iberian federation · member layers float over exchange layers float over the EU root · edges in a layer are flows carried by the layer below</text>

  <!-- LEVEL 2 -->
  <rect class="band" x="24" y="86" width="912" height="86" rx="8"/>
  <text class="bandlbl" x="36" y="104">level 2 · root</text>
  <rect class="fedbox" x="420" y="112" width="120" height="44"/>
  <text class="fedname" x="480" y="132" text-anchor="middle">eu-root</text>
  <circle class="fed" cx="462" cy="146" r="4"/><circle class="fed" cx="498" cy="146" r="4"/>
  <line class="edge" x1="462" y1="146" x2="498" y2="146"/>

  <!-- LEVEL 1 -->
  <rect class="band" x="24" y="196" width="912" height="96" rx="8"/>
  <text class="bandlbl" x="36" y="214">level 1 · exchange layers</text>
  <rect class="fedbox" x="150" y="224" width="150" height="52"/>
  <text class="fedname" x="225" y="246" text-anchor="middle">exchange-es</text>
  <circle class="es" cx="190" cy="262" r="4"/><circle class="es" cx="225" cy="262" r="4"/><circle class="es" cx="260" cy="262" r="4"/>
  <line class="edge" x1="190" y1="262" x2="225" y2="262"/><line class="edge" x1="225" y1="262" x2="260" y2="262"/>
  <rect class="fedbox" x="640" y="224" width="150" height="52"/>
  <text class="fedname" x="715" y="246" text-anchor="middle">exchange-pt</text>
  <circle class="pt" cx="697" cy="262" r="4"/><circle class="pt" cx="733" cy="262" r="4"/>
  <line class="edge" x1="697" y1="262" x2="733" y2="262"/>

  <!-- LEVEL 0 -->
  <rect class="band" x="24" y="316" width="912" height="128" rx="8"/>
  <text class="bandlbl" x="36" y="334">level 0 · operator member layers</text>

  <!-- ES members -->
  <g>
    <rect class="mbox" x="60"  y="348" width="96" height="80"/>
    <text class="mname" x="108" y="366" text-anchor="middle">member-1</text>
    <text class="capmut" x="108" y="380" text-anchor="middle">Movistar ES</text>
    <circle class="es" cx="82" cy="404" r="3"/><circle class="es" cx="108" cy="410" r="3"/><circle class="es" cx="134" cy="404" r="3"/><circle class="es" cx="108" cy="396" r="4"/>
    <line class="edge" x1="108" y1="396" x2="82" y2="404"/><line class="edge" x1="108" y1="396" x2="134" y2="404"/><line class="edge" x1="108" y1="396" x2="108" y2="410"/>
  </g>
  <g>
    <rect class="mbox" x="168" y="348" width="96" height="80"/>
    <text class="mname" x="216" y="366" text-anchor="middle">member-3</text>
    <text class="capmut" x="216" y="380" text-anchor="middle">Orange ES</text>
    <circle class="es" cx="192" cy="404" r="3"/><circle class="es" cx="240" cy="404" r="3"/><circle class="es" cx="216" cy="396" r="4"/>
    <line class="edge" x1="216" y1="396" x2="192" y2="404"/><line class="edge" x1="216" y1="396" x2="240" y2="404"/>
  </g>
  <g>
    <rect class="mbox" x="276" y="348" width="96" height="80"/>
    <text class="mname" x="324" y="366" text-anchor="middle">member-4</text>
    <text class="capmut" x="324" y="380" text-anchor="middle">Vodafone ES</text>
    <circle class="es" cx="300" cy="404" r="3"/><circle class="es" cx="348" cy="404" r="3"/><circle class="es" cx="324" cy="396" r="4"/>
    <line class="edge" x1="324" y1="396" x2="300" y2="404"/><line class="edge" x1="324" y1="396" x2="348" y2="404"/>
  </g>

  <!-- PT members -->
  <g>
    <rect class="mbox" x="600" y="348" width="96" height="80"/>
    <text class="mname" x="648" y="366" text-anchor="middle">member-2</text>
    <text class="capmut" x="648" y="380" text-anchor="middle">MEO PT</text>
    <circle class="pt" cx="624" cy="404" r="3"/><circle class="pt" cx="672" cy="404" r="3"/><circle class="pt" cx="648" cy="396" r="4"/>
    <line class="edge" x1="648" y1="396" x2="624" y2="404"/><line class="edge" x1="648" y1="396" x2="672" y2="404"/>
  </g>
  <g>
    <rect class="mbox" x="708" y="348" width="96" height="80"/>
    <text class="mname" x="756" y="366" text-anchor="middle">member-5</text>
    <text class="capmut" x="756" y="380" text-anchor="middle">Vodafone PT</text>
    <circle class="pt" cx="732" cy="404" r="3"/><circle class="pt" cx="780" cy="404" r="3"/><circle class="pt" cx="756" cy="396" r="4"/>
    <line class="edge" x1="756" y1="396" x2="732" y2="404"/><line class="edge" x1="756" y1="396" x2="780" y2="404"/>
  </g>

  <!-- DAG edges (floats_over) -->
  <line class="dagedge" x1="108" y1="348" x2="205" y2="276"/>
  <line class="dagedge" x1="216" y1="348" x2="225" y2="276"/>
  <line class="dagedge" x1="324" y1="348" x2="245" y2="276"/>
  <line class="dagedge" x1="648" y1="348" x2="705" y2="276"/>
  <line class="dagedge" x1="756" y1="348" x2="725" y2="276"/>
  <line class="dagedge" x1="225" y1="224" x2="470" y2="156"/>
  <line class="dagedge" x1="715" y1="224" x2="490" y2="156"/>

  <!-- CLIMB-2 path: member-1 UE  ->  eu-root  ->  member-2 -->
  <path class="climb" d="M 108 396 C 108 300, 225 300, 225 262 C 225 210, 460 200, 480 156"/>
  <path class="climb" d="M 648 396 C 648 300, 715 300, 715 262 C 715 210, 500 200, 480 156"/>
  <circle cx="108" cy="396" r="5" fill="#2a78d6"/>
  <circle cx="648" cy="396" r="5" fill="#2a78d6"/>
  <text class="climblbl" x="300" y="470">Movistar → MEO : climb 2, meets at eu-root  (ES↔PT border crossing)</text>
  <text class="capmut"   x="300" y="486">Movistar → Orange would meet at exchange-es (climb 1); same rule, smaller depth.</text>

  <!-- RECURSION callout -->
  <rect class="recbox" x="828" y="330" width="112" height="112"/>
  <text class="reclbl" x="884" y="348" text-anchor="middle" font-weight="600">recursion point</text>
  <text class="capmut" x="884" y="362" text-anchor="middle">one PSA node</text>
  <circle cx="884" cy="392" r="18" fill="none" stroke="#eb6834" stroke-width="1.4"/>
  <circle cx="884" cy="392" r="10" fill="none" stroke="#2a78d6" stroke-width="1.4"/>
  <line x1="884" y1="392" x2="884" y2="392" />
  <text class="capmut" x="884" y="418" text-anchor="middle">:border GUPF</text>
  <text class="capmut" x="884" y="431" text-anchor="middle">:psa GUPF</text>

  <!-- footnote -->
  <text class="cap" x="28" y="540">•  A GUPF = one (node, layer) pair with its own forwarding table.  A node in k layers = k GUPF instances (the recursion).</text>
  <text class="cap" x="28" y="560">•  Two graphs per layer: the service view is fully connected (every member one hop); the forwarding view is edge nodes + interior relays (sparse), carried by the layer below.</text>
  <text class="cap" x="28" y="580">•  classify_move climbs the DAG from both endpoints to the first common layer.  Climb depth = event class; the same rule covers intra / inter / crossing / NTN.</text>
  <text class="capmut" x="28" y="600">Federation cost: same reachability, but 5G needs O(K²) configured bilateral N32 links (no relay), RUPA needs O(K) enrollment + relay. Tables: level-0 user-scaled, level-1/2 member-scaled.</text>
</svg>
